<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- The page sends the form nowhere: it is filled and downloaded in the browser. The
       policy names no connect-src, so a request added by mistake is blocked, not sent.
       `frame-ancestors` is ignored in a meta tag, so clickjacking is not covered here. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self';
    style-src 'self';
    img-src 'self' data:;
    form-action 'none';
    base-uri 'none';
    object-src 'none'" />
  <meta name="referrer" content="no-referrer" />
  <title>IT:U HPC data template</title>
  <meta name="description" data-i18n-attr="content:meta.description"
        content="A short form about the data of a project that uses high-performance computing at IT:U: the project, its datasets and three questions, downloaded as a document and as hpc-template.json." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236d4aff'/%3E%3Ctext x='16' y='21' font-size='11' text-anchor='middle' fill='%23ffffff' font-family='monospace' font-weight='bold'%3EHPC%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./style.css?v=1" />
  <script src="./src/theme-boot.js?v=1"></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="rail" id="rail">
      <div class="brand-mark">
        <span class="brand-glyph" aria-hidden="true"></span>
        <div>
          <p class="brand-name" data-i18n="brand.name">HPC data template</p>
          <p class="brand-sub">IT:U · DART</p>
        </div>
      </div>
      <p class="nav-label" data-i18n="nav.label">View</p>
      <nav class="nav" aria-label="View" data-i18n-attr="aria-label:nav.label">
        <button class="nav-item" data-view="form" type="button" aria-pressed="true"><span data-i18n="nav.form">Fill in the template</span></button>
        <button class="nav-item" data-view="about" type="button" aria-pressed="false"><span data-i18n="about.title">About</span></button>
      </nav>
      <div class="rail-spacer"></div>
      <div class="rail-foot">
        <p class="sig">
          <span data-i18n="foot.team">DART · IT:U Interdisciplinary Transformation University Austria</span><br />
          <span data-i18n="foot.licence">Code under MIT, texts under CC BY 4.0</span><br />
          <a href="https://github.com/rijdho/dmp-hpc-template" target="_blank" rel="noreferrer" data-i18n="foot.source">Source on GitHub</a><br />
          <span id="version">0.1.0</span>
        </p>
      </div>
    </aside>

    <div class="main">
      <div class="cmdbar">
        <h1 class="cmd-title" id="cmd-title" data-i18n="nav.form">Fill in the template</h1>
        <span class="spacer"></span>
        <nav class="langs" id="lang" aria-label="Language" data-i18n-attr="aria-label:ui.lang.aria" hidden></nav>
        <button class="icon-btn" id="theme" type="button" aria-label="Toggle light/dark theme"
                data-i18n-attr="title:ui.theme.title;aria-label:ui.theme.aria">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z" /></svg>
        </button>
      </div>

      <main class="content">
        <div class="content-inner">

          <section class="view" data-view="form">
            <p class="eyebrow" data-i18n="ui.eyebrow">HPC data template</p>
            <p class="lede" data-i18n-html="ui.lede"></p>
            <p class="lede" data-i18n-html="ui.lede2"></p>

            <div class="toolbar" id="toolbar">
              <label class="btn file-btn"><span data-i18n="form.import">Open an hpc-template.json</span>
                <input type="file" id="import-file" accept=".json,application/json" /></label>
              <span class="validity" id="import-status" aria-live="polite"></span>
              <span class="spacer"></span>
              <button class="btn danger-quiet" id="new-form" type="button" data-i18n="form.new">Start over</button>
            </div>
            <p class="hint toolbar-hint" data-i18n="form.import.hint"></p>

            <section class="panel">
              <h2 class="panel-title" data-i18n="project.title">Project and funding</h2>
              <div class="grid2" id="project"></div>
              <p class="hint toolbar-hint" data-i18n="project.hint"></p>
            </section>

            <div class="reqs-head">
              <h2 class="panel-title" data-i18n="datasets.title">Datasets</h2>
              <span class="muted mono" id="ds-count"></span>
            </div>
            <p class="hint ds-lede" data-i18n="datasets.lede"></p>
            <div id="datasets"></div>
            <div class="toolbar">
              <button class="btn" id="add-dataset" type="button" data-i18n="datasets.add">Add a dataset</button>
            </div>

            <div class="reqs-head">
              <h2 class="panel-title" data-i18n="questions.title">The three questions</h2>
              <span class="muted mono" id="q-count"></span>
            </div>
            <div id="questions"></div>

            <section class="panel finish">
              <div class="validity" id="validity" aria-live="polite"></div>
              <div class="validity" id="completeness"></div>
              <ul class="problems" id="problems" hidden></ul>
              <div class="toolbar">
                <button class="btn btn-primary" id="dl-md" type="button" data-i18n="dl.md">Download the document (.md)</button>
                <button class="btn" id="dl-json" type="button" data-i18n="dl.json">Download hpc-template.json</button>
              </div>
            </section>
          </section>

          <section class="view prose" data-view="about" hidden>
            <p data-i18n-html="about.p1"></p>
            <p data-i18n-html="about.p2"></p>
            <p data-i18n-html="about.p3"></p>
          </section>

        </div>
      </main>
    </div>
  </div>
  <script type="module" src="./src/app.js?v=3"></script>
</body>
</html>
